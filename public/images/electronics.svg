<svg xmlns="http://www.w3.org/2000/svg" width="120" height="80" viewBox="0 0 120 80">
  <defs>
    <linearGradient id="phoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1f2937;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111827;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="120" height="80" rx="8" fill="#f0f9ff" />
  <g transform="translate(28,8)">
    <!-- Phone -->
    <rect x="0" y="0" width="32" height="56" rx="3" fill="url(#phoneGrad)" stroke="#000" stroke-width="1.5"/>
    <!-- Screen -->
    <rect x="2" y="2" width="28" height="44" rx="2" fill="#06b6d4" stroke="#0891b2" stroke-width="0.5"/>
    <circle cx="16" cy="50" r="2" fill="#1f2937"/>
    <!-- App icons on screen -->
    <rect x="5" y="5" width="3" height="3" fill="#fbbf24" opacity="0.8"/>
    <rect x="10" y="5" width="3" height="3" fill="#f87171" opacity="0.8"/>
    <rect x="15" y="5" width="3" height="3" fill="#60a5fa" opacity="0.8"/>
    <rect x="5" y="11" width="3" height="3" fill="#34d399" opacity="0.8"/>
    <rect x="10" y="11" width="3" height="3" fill="#a78bfa" opacity="0.8"/>
  </g>
</svg>