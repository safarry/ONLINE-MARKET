<svg xmlns="http://www.w3.org/2000/svg" width="120" height="80" viewBox="0 0 120 80">
  <defs>
    <linearGradient id="lipstickGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ec4899;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#be185d;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="120" height="80" rx="8" fill="#fce7f3" />
  <g transform="translate(24,12)">
    <!-- Lipstick tube -->
    <rect x="8" y="0" width="12" height="30" rx="2" fill="#d1d5db" stroke="#9ca3af" stroke-width="0.5"/>
    <!-- Lipstick color -->
    <rect x="10" y="4" width="8" height="20" fill="url(#lipstickGrad)" stroke="#be185d" stroke-width="0.5"/>
    <!-- Shine -->
    <ellipse cx="13" cy="8" rx="1.5" ry="2" fill="#fff" opacity="0.5"/>
    <!-- Compact mirror -->
    <circle cx="28" cy="20" r="12" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
    <circle cx="28" cy="20" r="10" fill="#fbbf24" opacity="0.1"/>
    <circle cx="28" cy="20" r="8" fill="#fff" stroke="#e5e7eb" stroke-width="0.5"/>
    <!-- Shine on mirror -->
    <circle cx="24" cy="16" r="1.5" fill="#fff" opacity="0.6"/>
  </g>
</svg>