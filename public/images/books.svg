<svg xmlns="http://www.w3.org/2000/svg" width="120" height="80" viewBox="0 0 120 80">
  <defs>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fca311;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8860d;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="120" height="80" rx="8" fill="#fef3e2" />
  <g transform="translate(20,10)">
    <!-- Book 1 -->
    <rect x="0" y="0" width="16" height="50" rx="2" fill="url(#bookGrad)" stroke="#d67a0b" stroke-width="1"/>
    <line x1="2" y1="8" x2="14" y2="8" stroke="#fff" stroke-width="1"/>
    <line x1="2" y1="16" x2="14" y2="16" stroke="#fff" stroke-width="1" opacity="0.6"/>
    <!-- Book 2 -->
    <rect x="18" y="2" width="16" height="50" rx="2" fill="#2563eb" stroke="#1e40af" stroke-width="1"/>
    <line x1="20" y1="10" x2="32" y2="10" stroke="#fff" stroke-width="1.5"/>
    <!-- Book 3 -->
    <rect x="36" y="4" width="16" height="50" rx="2" fill="#dc2626" stroke="#b91c1c" stroke-width="1"/>
    <circle cx="44" cy="20" r="4" fill="#fff" opacity="0.7"/>
  </g>
</svg>