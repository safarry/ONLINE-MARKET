<svg xmlns="http://www.w3.org/2000/svg" width="120" height="80" viewBox="0 0 120 80">
  <defs>
    <linearGradient id="dumbbellGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="120" height="80" rx="8" fill="#eff6ff" />
  <g transform="translate(18,18)">
    <!-- Left weight -->
    <circle cx="6" cy="22" r="8" fill="#ef4444" stroke="#dc2626" stroke-width="1"/>
    <!-- Bar -->
    <rect x="14" y="18" width="20" height="8" rx="2" fill="url(#dumbbellGrad)" stroke="#1e40af" stroke-width="1"/>
    <!-- Right weight -->
    <circle cx="38" cy="22" r="8" fill="#3b82f6" stroke="#1e40af" stroke-width="1"/>
    <!-- Grip marks -->
    <line x1="18" y1="20" x2="18" y2="24" stroke="#0284c7" stroke-width="0.5"/>
    <line x1="22" y1="20" x2="22" y2="24" stroke="#0284c7" stroke-width="0.5"/>
    <line x1="26" y1="20" x2="26" y2="24" stroke="#0284c7" stroke-width="0.5"/>
    <line x1="30" y1="20" x2="30" y2="24" stroke="#0284c7" stroke-width="0.5"/>
  </g>
</svg>